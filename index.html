<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="1800">
  <title> Avery's School Menu</title>
  <style>
    :root { --bg:#0f172a; --card:#172033; --text:#f8fafc; --muted:#aab6ca; --accent:#38bdf8; --today:#203a52; }
    * { box-sizing:border-box; }
    body { margin:0; background:transparent; color:var(--text); font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif; }
    .wrap { padding:12px; }
    .top { display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:10px; }
    h1 { margin:0; font-size:clamp(22px,3vw,34px); }
    #range { color:var(--muted); font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:9px; }
    .day { min-width:0; background:rgba(23,32,51,.94); border:1px solid rgba(255,255,255,.08); border-radius:14px; overflow:hidden; }
    .day.today { background:var(--today); outline:2px solid var(--accent); }
    .head { padding:10px 11px 8px; border-bottom:1px solid rgba(255,255,255,.08); }
    .dow { font-size:15px; font-weight:800; letter-spacing:.08em; }
    .date { color:var(--muted); font-size:12px; margin-top:2px; }
    .meal { padding:10px 11px; }
    .meal + .meal { border-top:1px solid rgba(255,255,255,.08); }
    .label { font-size:12px; font-weight:800; letter-spacing:.08em; color:var(--accent); margin-bottom:6px; }
    ul { list-style:none; margin:0; padding:0; }
    li { font-size:clamp(12px,1.35vw,16px); line-height:1.28; margin:0 0 6px; overflow-wrap:anywhere; }
    li:last-child { margin-bottom:0; }
    .tag { color:var(--muted); font-size:.8em; }
    .empty { color:var(--muted); font-style:italic; }
    .error { padding:18px; border-radius:12px; background:rgba(127,29,29,.7); }
    .foot { color:var(--muted); font-size:10px; text-align:right; margin-top:7px; }
    @media (max-width:800px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>🍎 School Menu</h1><div id="range"></div></div>
  <div id="content">Loading menu…</div>
  <div class="foot" id="updated"></div>
</div>
<script>
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const localKey = d => new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(d);
fetch("./menu.json?ts="+Date.now(), {cache:"no-store"}).then(r => {
  if(!r.ok) throw new Error("menu.json unavailable");
  return r.json();
}).then(data => {
  if(data.error) throw new Error(data.error);
  const today = localKey(new Date());
  document.getElementById("range").textContent = data.weekLabel || "";
  const cards = (data.days || []).map(d => {
    const meals = type => {
      const arr = d[type] || [];
      return arr.length ? `<ul>${arr.map(x=>`<li>${esc(x.name)}${x.note?` <span class="tag">(${esc(x.note)})</span>`:""}</li>`).join("")}</ul>` : `<div class="empty">No menu listed</div>`;
    };
    return `<section class="day ${d.iso===today?"today":""}">
      <div class="head"><div class="dow">${esc(d.weekday)}</div><div class="date">${esc(d.displayDate)}</div></div>
      <div class="meal"><div class="label">🍳 BREAKFAST</div>${meals("breakfast")}</div>
      <div class="meal"><div class="label">🍎 LUNCH</div>${meals("lunch")}</div>
    </section>`;
  }).join("");
  document.getElementById("content").innerHTML = `<div class="grid">${cards}</div>`;
  document.getElementById("updated").textContent = data.updatedAt ? `Updated ${new Date(data.updatedAt).toLocaleString()}` : "";
}).catch(err => {
  document.getElementById("content").innerHTML = `<div class="error"><strong>Menu update unavailable.</strong><br>${esc(err.message)}</div>`;
});
</script>
</body>
</html>
